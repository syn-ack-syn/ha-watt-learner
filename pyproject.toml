# Development only: runs the test suite with `uv run pytest`. Home Assistant installs the
# integration from custom_components/watt_learner, so nothing here is built or published.
[project]
name = "ha-watt-learner"
version = "0.1.0"
description = "Development environment for the Watt Learner Home Assistant integration"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9"]
# Config flow and setup tests against Home Assistant (tests_ha/), in their own environment:
# `UV_PROJECT_ENVIRONMENT=.venv-ha uv run --no-default-groups --group ha pytest tests_ha`.
# Pinned to the release that matches the minimum Home Assistant version in hacs.json (2025.1.0).
ha = [
    "pytest-homeassistant-custom-component==0.13.201",
    "aiohasupervisor==0.2.2b5",
]

[tool.uv]
package = false
conflicts = [[{ group = "dev" }, { group = "ha" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
